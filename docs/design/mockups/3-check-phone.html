<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup: Check your paper (phone)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&amp;family=Noto+Serif+SC:wght@500&amp;display=swap">
<style>
body{margin:0}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #EEF6F1; font-family: 'Baloo 2', system-ui, sans-serif; color: #1D2B36; display: flex; flex-direction: column; padding: 22px 20px 28px">

  <div style="text-align: center">
    <div style="font-family: 'Kaiti SC','STKaiti','KaiTi','Noto Serif SC',serif; font-size: 38px; line-height: 1.15">看答案</div>
    <div style="font-size: 17px; font-weight: 700">Check your paper</div>
    <div style="margin-top: 6px; font-size: 14px; font-weight: 500; color: #4F5F6B">For each word, tap the happy face if you wrote it right, or the other face to practise it again.</div>
  </div>

  <div style="margin-top: 18px; display: flex; flex-direction: column; gap: 10px">

    <div style="display: flex; align-items: center; gap: 10px; background: #FFFFFF; border-radius: 20px; padding: 8px 10px 8px 8px">
      <button type="button" aria-label="Hear 月亮" style="width: 44px; height: 44px; border-radius: 50%; border: none; background: #EEF6F1; display: grid; place-items: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1D2B36" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="#1D2B36"></path><path d="M16 9a4.2 4.2 0 0 1 0 6"></path></svg></button>
      <div style="flex: 1; display: flex; flex-direction: column; line-height: 1.1"><span style="font-family: 'Kaiti SC','STKaiti','KaiTi','Noto Serif SC',serif; font-size: 32px">月亮</span><span style="font-size: 14px; font-weight: 600; color: #4F5F6B">yuè liàng</span></div>
      <button type="button" aria-label="I got it right" aria-pressed="true" style="width: 52px; height: 52px; border-radius: 50%; border: none; background: #2F6FDB; display: grid; place-items: center; cursor: pointer"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M8 14.5a5 5 0 0 0 8 0"></path><path d="M9 9.5v.5M15 9.5v.5"></path></svg></button>
      <button type="button" aria-label="Practise again" aria-pressed="false" style="width: 52px; height: 52px; box-sizing: border-box; border-radius: 50%; border: 2px solid #D0E2D7; background: #FFFFFF; display: grid; place-items: center; cursor: pointer"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#8A9AA5" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M8.5 16c1-.8 2.2-1.2 3.5-1.2s2.5.4 3.5 1.2"></path><path d="M9 9.5v.5M15 9.5v.5"></path></svg></button>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; background: #FFFFFF; border-radius: 20px; padding: 8px 10px 8px 8px">
      <button type="button" aria-label="Hear 太阳" style="width: 44px; height: 44px; border-radius: 50%; border: none; background: #EEF6F1; display: grid; place-items: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1D2B36" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="#1D2B36"></path><path d="M16 9a4.2 4.2 0 0 1 0 6"></path></svg></button>
      <div style="flex: 1; display: flex; flex-direction: column; line-height: 1.1"><span style="font-family: 'Kaiti SC','STKaiti','KaiTi','Noto Serif SC',serif; font-size: 32px">太阳</span><span style="font-size: 14px; font-weight: 600; color: #4F5F6B">tài yáng</span></div>
      <button type="button" aria-label="I got it right" aria-pressed="true" style="width: 52px; height: 52px; border-radius: 50%; border: none; background: #2F6FDB; display: grid; place-items: center; cursor: pointer"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M8 14.5a5 5 0 0 0 8 0"></path><path d="M9 9.5v.5M15 9.5v.5"></path></svg></button>
      <button type="button" aria-label="Practise again" aria-pressed="false" style="width: 52px; height: 52px; box-sizing: border-box; border-radius: 50%; border: 2px solid #D0E2D7; background: #FFFFFF; display: grid; place-items: center; cursor: pointer"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#8A9AA5" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M8.5 16c1-.8 2.2-1.2 3.5-1.2s2.5.4 3.5 1.2"></path><path d="M9 9.5v.5M15 9.5v.5"></path></svg></button>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; background: #FFFFFF; border-radius: 20px; padding: 8px 10px 8px 8px; box-shadow: inset 0 0 0 2px #F2A64B">
      <button type="button" aria-label="Hear 彩虹" style="width: 44px; height: 44px; border-radius: 50%; border: none; background: #EEF6F1; display: grid; place-items: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1D2B36" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="#1D2B36"></path><path d="M16 9a4.2 4.2 0 0 1 0 6"></path></svg></button>
      <div style="flex: 1; display: flex; flex-direction: column; line-height: 1.1"><span style="font-family: 'Kaiti SC','STKaiti','KaiTi','Noto Serif SC',serif; font-size: 32px">彩虹</span><span style="font-size: 14px; font-weight: 600; color: #4F5F6B">cǎi hóng</span></div>
      <button type="button" aria-label="I got it right" aria-pressed="false" style="width: 52px; height: 52px; box-sizing: border-box; border-radius: 50%; border: 2px solid #D0E2D7; background: #FFFFFF; display: grid; place-items: center; cursor: pointer"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#8A9AA5" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M8 14.5a5 5 0 0 0 8 0"></path><path d="M9 9.5v.5M15 9.5v.5"></path></svg></button>
      <button type="button" aria-label="Practise again" aria-pressed="true" style="width: 52px; height: 52px; border-radius: 50%; border: none; background: #C4570F; display: grid; place-items: center; cursor: pointer"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M8.5 16c1-.8 2.2-1.2 3.5-1.2s2.5.4 3.5 1.2"></path><path d="M9 9.5v.5M15 9.5v.5"></path></svg></button>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; background: #FFFFFF; border-radius: 20px; padding: 8px 10px 8px 8px">
      <button type="button" aria-label="Hear 星星" style="width: 44px; height: 44px; border-radius: 50%; border: none; background: #EEF6F1; display: grid; place-items: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1D2B36" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="#1D2B36"></path><path d="M16 9a4.2 4.2 0 0 1 0 6"></path></svg></button>
      <div style="flex: 1; display: flex; flex-direction: column; line-height: 1.1"><span style="font-family: 'Kaiti SC','STKaiti','KaiTi','Noto Serif SC',serif; font-size: 32px">星星</span><span style="font-size: 14px; font-weight: 600; color: #4F5F6B">xīng xing</span></div>
      <button type="button" aria-label="I got it right" aria-pressed="false" style="width: 52px; height: 52px; box-sizing: border-box; border-radius: 50%; border: 2px solid #D0E2D7; background: #FFFFFF; display: grid; place-items: center; cursor: pointer"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#8A9AA5" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M8 14.5a5 5 0 0 0 8 0"></path><path d="M9 9.5v.5M15 9.5v.5"></path></svg></button>
      <button type="button" aria-label="Practise again" aria-pressed="false" style="width: 52px; height: 52px; box-sizing: border-box; border-radius: 50%; border: 2px solid #D0E2D7; background: #FFFFFF; display: grid; place-items: center; cursor: pointer"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#8A9AA5" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M8.5 16c1-.8 2.2-1.2 3.5-1.2s2.5.4 3.5 1.2"></path><path d="M9 9.5v.5M15 9.5v.5"></path></svg></button>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; background: #FFFFFF; border-radius: 20px; padding: 8px 10px 8px 8px">
      <button type="button" aria-label="Hear 下雨" style="width: 44px; height: 44px; border-radius: 50%; border: none; background: #EEF6F1; display: grid; place-items: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1D2B36" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="#1D2B36"></path><path d="M16 9a4.2 4.2 0 0 1 0 6"></path></svg></button>
      <div style="flex: 1; display: flex; flex-direction: column; line-height: 1.1"><span style="font-family: 'Kaiti SC','STKaiti','KaiTi','Noto Serif SC',serif; font-size: 32px">下雨</span><span style="font-size: 14px; font-weight: 600; color: #4F5F6B">xià yǔ</span></div>
      <button type="button" aria-label="I got it right" aria-pressed="false" style="width: 52px; height: 52px; box-sizing: border-box; border-radius: 50%; border: 2px solid #D0E2D7; background: #FFFFFF; display: grid; place-items: center; cursor: pointer"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#8A9AA5" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M8 14.5a5 5 0 0 0 8 0"></path><path d="M9 9.5v.5M15 9.5v.5"></path></svg></button>
      <button type="button" aria-label="Practise again" aria-pressed="false" style="width: 52px; height: 52px; box-sizing: border-box; border-radius: 50%; border: 2px solid #D0E2D7; background: #FFFFFF; display: grid; place-items: center; cursor: pointer"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#8A9AA5" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M8.5 16c1-.8 2.2-1.2 3.5-1.2s2.5.4 3.5 1.2"></path><path d="M9 9.5v.5M15 9.5v.5"></path></svg></button>
    </div>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 10px">
    <span style="font-size: 15px; font-weight: 600; color: #4F5F6B">3 of 5 checked</span>
    <button type="button" style="width: 100%; height: 66px; border-radius: 999px; border: none; background: #F6C343; box-shadow: 0 5px 0 #D9A51F; color: #1D2B36; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 12px; cursor: pointer">
      <span style="font-size: 22px; font-weight: 800">完成</span><span style="font-size: 16px; font-weight: 600">Done</span>
    </button>
  </div>
</div>
</body>
</html>
