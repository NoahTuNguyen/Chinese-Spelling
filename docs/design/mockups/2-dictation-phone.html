<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup: Dictation — word 2 of 5 (phone)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&amp;family=Noto+Serif+SC:wght@500&amp;display=swap">
<style>
body{margin:0}
.tzg{position:relative}
.tzg::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:1.5px dashed rgba(47,148,97,.45)}
.tzg::after{content:"";position:absolute;top:50%;left:0;right:0;border-top:1.5px dashed rgba(47,148,97,.45)}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #EEF6F1; font-family: 'Baloo 2', system-ui, sans-serif; color: #1D2B36; display: flex; flex-direction: column; padding: 18px 20px 28px">

  <div style="display: flex; align-items: center; justify-content: space-between">
    <button type="button" aria-label="Stop dictation" style="width: 48px; height: 48px; border-radius: 50%; border: none; background: #FFFFFF; display: grid; place-items: center; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4F5F6B" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
    <span style="font-family: 'Kaiti SC','STKaiti','KaiTi','Noto Serif SC',serif; font-size: 24px">听写（十五）</span>
    <span style="min-width: 48px; text-align: right; font-size: 18px; font-weight: 800">2<span style="color: #4F5F6B; font-weight: 600"> / 5</span></span>
  </div>

  <div style="margin-top: 18px; display: flex; align-items: center; justify-content: center; gap: 0" aria-label="Word 2 of 5">
    <span style="width: 30px; height: 30px; border-radius: 50%; background: #2F9461; display: grid; place-items: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
    <span style="width: 26px; height: 4px; background: #2F9461"></span>
    <span style="width: 34px; height: 34px; box-sizing: border-box; border-radius: 50%; border: 4px solid #F6C343; background: #FFFFFF"></span>
    <span style="width: 26px; height: 4px; background: #D0E2D7"></span>
    <span style="width: 30px; height: 30px; border-radius: 50%; background: #D0E2D7"></span>
    <span style="width: 26px; height: 4px; background: #D0E2D7"></span>
    <span style="width: 30px; height: 30px; border-radius: 50%; background: #D0E2D7"></span>
    <span style="width: 26px; height: 4px; background: #D0E2D7"></span>
    <span style="width: 30px; height: 30px; border-radius: 50%; background: #D0E2D7"></span>
  </div>

  <div style="margin-top: 30px; text-align: center">
    <div style="font-family: 'Kaiti SC','STKaiti','KaiTi','Noto Serif SC',serif; font-size: 34px; line-height: 1.2">听一听，写一写</div>
    <div style="font-size: 16px; font-weight: 600; color: #4F5F6B">Listen, then write it on your paper</div>
  </div>

  <div style="margin-top: 26px; display: flex; flex-direction: column; align-items: center; gap: 10px">
    <button type="button" aria-label="Hear the word again" style="position: relative; width: 176px; height: 176px; border-radius: 50%; border: none; background: #F6C343; box-shadow: 0 8px 0 #D9A51F, 0 0 0 14px rgba(246,195,67,.25); display: grid; place-items: center; cursor: pointer">
      <svg width="84" height="84" viewBox="0 0 24 24" fill="none" stroke="#1D2B36" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="#1D2B36"></path><path d="M15.5 9a4.2 4.2 0 0 1 0 6"></path><path d="M18 6.5a8 8 0 0 1 0 11"></path></svg>
    </button>
    <div style="margin-top: 10px; text-align: center; line-height: 1.15">
      <div style="font-size: 22px; font-weight: 800">再听一次</div>
      <div style="font-size: 14px; font-weight: 600; color: #4F5F6B">Hear again</div>
    </div>
  </div>

  <div style="margin-top: 26px; display: flex; flex-direction: column; align-items: center; gap: 8px">
    <div style="display: flex">
      <span class="tzg" style="width: 92px; height: 92px; box-sizing: border-box; border: 2.5px solid #2F9461; background: #FFFFFF"></span>
      <span class="tzg" style="width: 92px; height: 92px; box-sizing: border-box; border: 2.5px solid #2F9461; border-left: none; background: #FFFFFF"></span>
    </div>
    <span style="font-size: 14px; font-weight: 600; color: #4F5F6B">2 个字 · 2 characters</span>
  </div>

  <div style="margin-top: auto">
    <button type="button" style="width: 100%; height: 66px; border-radius: 999px; border: none; background: #1D2B36; color: #FFFFFF; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 12px; cursor: pointer">
      <span style="font-size: 22px; font-weight: 800">下一个</span><span style="font-size: 16px; font-weight: 600; color: #D5E1EA">Next</span>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F6C343" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
    </button>
  </div>
</div>
</body>
</html>
