<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup: Well done — stickers (phone)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&amp;family=Noto+Serif+SC:wght@500&amp;display=swap">
<style>
body{margin:0}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #EEF6F1; font-family: 'Baloo 2', system-ui, sans-serif; color: #1D2B36; display: flex; flex-direction: column; align-items: center; padding: 30px 20px 28px">

  <span aria-hidden="true" style="position: absolute; left: 34px; top: 40px; width: 12px; height: 22px; border-radius: 4px; background: #F2A64B; transform: rotate(-24deg)"></span>
  <span aria-hidden="true" style="position: absolute; left: 82px; top: 110px; width: 10px; height: 10px; border-radius: 50%; background: #2F6FDB"></span>
  <span aria-hidden="true" style="position: absolute; right: 44px; top: 52px; width: 12px; height: 22px; border-radius: 4px; background: #9B8CF0; transform: rotate(30deg)"></span>
  <span aria-hidden="true" style="position: absolute; right: 88px; top: 128px; width: 10px; height: 10px; border-radius: 50%; background: #2F9461"></span>
  <span aria-hidden="true" style="position: absolute; right: 26px; top: 190px; width: 10px; height: 18px; border-radius: 4px; background: #F6C343; transform: rotate(-12deg)"></span>
  <span aria-hidden="true" style="position: absolute; left: 22px; top: 200px; width: 9px; height: 9px; border-radius: 50%; background: #E5533D"></span>

  <div style="display: flex; gap: 6px; align-items: flex-end" role="img" aria-label="4 out of 5 stars">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="#F6C343" stroke="#C98F00" stroke-width="1.2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"></path></svg>
    <svg width="48" height="48" viewBox="0 0 24 24" fill="#F6C343" stroke="#C98F00" stroke-width="1.2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"></path></svg>
    <svg width="58" height="58" viewBox="0 0 24 24" fill="#F6C343" stroke="#C98F00" stroke-width="1.2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"></path></svg>
    <svg width="48" height="48" viewBox="0 0 24 24" fill="#F6C343" stroke="#C98F00" stroke-width="1.2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"></path></svg>
    <svg width="40" height="40" viewBox="0 0 24 24" fill="#DCE8E1" stroke="#B9CCC1" stroke-width="1.2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"></path></svg>
  </div>

  <div style="margin-top: 10px; font-family: 'Kaiti SC','STKaiti','KaiTi','Noto Serif SC',serif; font-size: 54px; line-height: 1.1">做得好！</div>
  <div style="font-size: 20px; font-weight: 700">Well done! 4 out of 5</div>

  <div style="margin-top: 22px; width: 100%; box-sizing: border-box; background: #FFFFFF; border-radius: 26px; padding: 18px 18px 20px; display: flex; flex-direction: column; align-items: center; gap: 14px">
    <div style="display: flex; align-items: center; gap: 14px">
      <span style="width: 78px; height: 78px; border-radius: 50%; background: #F6C343; box-shadow: 0 0 0 6px #FFF0BF; display: flex; flex-direction: column; align-items: center; justify-content: center; transform: rotate(-8deg)">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"></path></svg>
        <span style="font-family: 'Kaiti SC','STKaiti','KaiTi','Noto Serif SC',serif; font-size: 18px; line-height: 1">十五</span>
      </span>
      <div style="line-height: 1.2"><div style="font-size: 20px; font-weight: 800">新贴纸！</div><div style="font-size: 15px; font-weight: 600; color: #4F5F6B">New sticker for this week</div></div>
    </div>

    <div style="width: 100%; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px"><span style="width: 52px; height: 52px; border-radius: 50%; background: #F6C343; display: grid; place-items: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"></path></svg></span><span style="font-size: 12px; font-weight: 700">十四</span></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px"><span style="width: 52px; height: 52px; border-radius: 50%; background: #F6C343; box-shadow: 0 0 0 4px #FFF0BF; display: grid; place-items: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"></path></svg></span><span style="font-size: 12px; font-weight: 700">十五</span></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px"><span style="width: 52px; height: 52px; box-sizing: border-box; border-radius: 50%; border: 2px dashed #B9CCC1"></span><span style="font-size: 12px; font-weight: 600; color: #4F5F6B">十六</span></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px"><span style="width: 52px; height: 52px; box-sizing: border-box; border-radius: 50%; border: 2px dashed #B9CCC1"></span><span style="font-size: 12px; font-weight: 600; color: #4F5F6B">十七</span></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px"><span style="width: 52px; height: 52px; box-sizing: border-box; border-radius: 50%; border: 2px dashed #B9CCC1"></span><span style="font-size: 12px; font-weight: 600; color: #4F5F6B">十八</span></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px"><span style="width: 52px; height: 52px; box-sizing: border-box; border-radius: 50%; border: 2px dashed #B9CCC1"></span><span style="font-size: 12px; font-weight: 600; color: #4F5F6B">十九</span></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px"><span style="width: 52px; height: 52px; box-sizing: border-box; border-radius: 50%; border: 2px dashed #B9CCC1"></span><span style="font-size: 12px; font-weight: 600; color: #4F5F6B">二十</span></div>
    </div>
  </div>

  <div style="margin-top: auto; width: 100%; display: flex; flex-direction: column; gap: 12px">
    <button type="button" style="width: 100%; height: 66px; border-radius: 999px; border: none; background: #F6C343; box-shadow: 0 5px 0 #D9A51F; color: #1D2B36; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer">
      <span style="font-size: 21px; font-weight: 800">再练一次</span><span style="font-size: 15px; font-weight: 600">Practise 彩虹 again</span>
    </button>
    <button type="button" style="width: 100%; height: 56px; border-radius: 999px; border: 2px solid #D0E2D7; background: #FFFFFF; color: #1D2B36; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer">
      <span style="font-size: 18px; font-weight: 800">回到单词</span><span style="font-size: 15px; font-weight: 600; color: #4F5F6B">Back to words</span>
    </button>
  </div>
</div>
</body>
</html>
