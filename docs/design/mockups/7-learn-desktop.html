<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup: Learn (desktop)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&amp;family=Noto+Serif+SC:wght@500&amp;display=swap">
<style>
body{margin:0}
.tzg{position:relative}
.tzg::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:1.5px dashed rgba(47,148,97,.45)}
.tzg::after{content:"";position:absolute;top:50%;left:0;right:0;border-top:1.5px dashed rgba(47,148,97,.45)}
</style>
</head>
<body>
<div style="min-height: 820px; box-sizing: border-box; background: #EEF6F1; font-family: 'Baloo 2', system-ui, sans-serif; color: #1D2B36; padding: 0 0 32px">

  <header style="background: #FFFFFF; border-bottom: 1px solid #D5E6DC">
    <div style="max-width: 1200px; margin: 0 auto; padding: 12px 32px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
      <div style="display: flex; align-items: center; gap: 10px">
        <span style="width: 40px; height: 40px; box-sizing: border-box; border: 2.5px solid #2F9461; border-radius: 10px; display: grid; place-items: center; font-family: 'Kaiti SC','STKaiti','KaiTi','Noto Serif SC',serif; font-size: 26px">听</span>
        <span style="font-size: 20px; font-weight: 800">听写 practice</span>
      </div>
      <nav aria-label="Sections" style="display: flex; gap: 4px; background: #EEF6F1; padding: 4px; border-radius: 999px">
        <a href="#" aria-current="page" style="height: 44px; padding: 0 20px; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; gap: 8px; text-decoration: none; color: #1D2B36"><span style="font-size: 18px; font-weight: 800">学习</span><span style="font-size: 14px; font-weight: 600">Learn</span></a>
        <a href="#" style="height: 44px; padding: 0 20px; border-radius: 999px; display: flex; align-items: center; gap: 8px; text-decoration: none; color: #4F5F6B"><span style="font-size: 18px; font-weight: 700">听写</span><span style="font-size: 14px; font-weight: 600">Dictation</span></a>
        <a href="#" style="height: 44px; padding: 0 20px; border-radius: 999px; display: flex; align-items: center; gap: 8px; text-decoration: none; color: #4F5F6B"><span style="font-size: 18px; font-weight: 700">难词</span><span style="font-size: 14px; font-weight: 600">Tricky</span><span style="min-width: 20px; height: 20px; border-radius: 999px; background: #E07A1F; color: #FFFFFF; font-size: 12px; font-weight: 800; display: grid; place-items: center">2</span></a>
      </nav>
      <button type="button" style="height: 44px; padding: 0 16px; border-radius: 999px; border: 2px solid #D0E2D7; background: #FFFFFF; display: flex; align-items: center; gap: 8px; font-family: inherit; font-size: 15px; font-weight: 700; color: #4F5F6B; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4F5F6B" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"></path></svg>
        Parent corner
      </button>
    </div>
  </header>

  <main style="max-width: 1200px; margin: 0 auto; padding: 28px 32px 0">
    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
      <div>
        <span style="background: #FFFFFF; color: #1E6B45; font-size: 14px; font-weight: 700; padding: 3px 14px; border-radius: 999px">本周 This week</span>
        <h1 style="margin: 8px 0 0; font-family: 'Kaiti SC','STKaiti','KaiTi','Noto Serif SC',serif; font-weight: 500; font-size: 56px; line-height: 1.1">听写（十五）</h1>
        <div style="display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 600">Tuesday 20 October <span style="background: #F6C343; padding: 0 12px; border-radius: 999px; font-size: 14px; font-weight: 700">in 7 days</span></div>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border-radius: 18px; padding: 10px 16px">
        <span style="font-size: 15px; font-weight: 700">我的贴纸 <span style="font-weight: 500; color: #4F5F6B">My stickers</span></span>
        <span style="width: 30px; height: 30px; border-radius: 50%; background: #F6C343; display: grid; place-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"></path></svg></span>
        <span style="width: 30px; height: 30px; box-sizing: border-box; border-radius: 50%; border: 2px dashed #2F9461"></span>
        <span style="width: 30px; height: 30px; border-radius: 50%; background: #E1ECE5"></span>
        <span style="width: 30px; height: 30px; border-radius: 50%; background: #E1ECE5"></span>
        <span style="width: 30px; height: 30px; border-radius: 50%; background: #E1ECE5"></span>
      </div>
    </div>

    <div style="margin-top: 26px; display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 16px">

      <button type="button" aria-label="Hear 星星" style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 22px 10px 16px; border-radius: 28px; border: 2px solid #FFFFFF; background: #FFF4C7; box-shadow: 0 4px 0 rgba(29,43,54,.08); font-family: inherit; color: inherit; cursor: pointer">
        <svg style="position: absolute; left: 14px; top: 12px" width="30" height="30" viewBox="0 0 24 24" fill="#F6C343" stroke="#B57F00" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"></path></svg>
        <span style="display: flex"><span class="tzg" style="width: 70px; height: 70px; box-sizing: border-box; border: 2px solid #2F9461; background: #FFFFFF; display: grid; place-items: center; font-family: 'Kaiti SC','STKaiti','KaiTi','Noto Serif SC',serif; font-size: 54px; line-height: 1">星</span><span class="tzg" style="width: 70px; height: 70px; box-sizing: border-box; border: 2px solid #2F9461; border-left: none; background: #FFFFFF; display: grid; place-items: center; font-family: 'Kaiti SC','STKaiti','KaiTi','Noto Serif SC',serif; font-size: 54px; line-height: 1">星</span></span>
        <span style="font-size: 21px; font-weight: 700">xīng xing</span>
      </button>

      <button type="button" aria-label="Hear 月亮" style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 22px 10px 16px; border-radius: 28px; border: 2px solid #FFFFFF; background: #ECE6FF; box-shadow: 0 4px 0 rgba(29,43,54,.08); font-family: inherit; color: inherit; cursor: pointer">
        <svg style="position: absolute; left: 14px; top: 12px" width="30" height="30" viewBox="0 0 24 24" fill="#C9C2F5" stroke="#5B4FC4" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg>
        <span style="display: flex"><span class="tzg" style="width: 70px; height: 70px; box-sizing: border-box; border: 2px solid #2F9461; background: #FFFFFF; display: grid; place-items: center; font-family: 'Kaiti SC','STKaiti','KaiTi','Noto Serif SC',serif; font-size: 54px; line-height: 1">月</span><span class="tzg" style="width: 70px; height: 70px; box-sizing: border-box; border: 2px solid #2F9461; border-left: none; background: #FFFFFF; display: grid; place-items: center; font-family: 'Kaiti SC','STKaiti','KaiTi','Noto Serif SC',serif; font-size: 54px; line-height: 1">亮</span></span>
        <span style="font-size: 21px; font-weight: 700">yuè liàng</span>
      </button>

      <button type="button" aria-label="Hear 彩虹 (keyboard focus)" style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 22px 10px 16px; border-radius: 28px; border: 2px solid #FFFFFF; background: #E2EFFF; box-shadow: 0 0 0 4px #2F9461; font-family: inherit; color: inherit; cursor: pointer">
        <svg style="position: absolute; left: 12px; top: 12px" width="34" height="28" viewBox="0 0 28 22" fill="none" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M3 19a11 11 0 0 1 22 0" stroke="#E5533D"></path><path d="M7 19a7 7 0 0 1 14 0" stroke="#F2A43A"></path><path d="M11 19a3 3 0 0 1 6 0" stroke="#2F7FC1"></path></svg>
        <span style="display: flex"><span class="tzg" style="width: 70px; height: 70px; box-sizing: border-box; border: 2px solid #2F9461; background: #FFFFFF; display: grid; place-items: center; font-family: 'Kaiti SC','STKaiti','KaiTi','Noto Serif SC',serif; font-size: 54px; line-height: 1">彩</span><span class="tzg" style="width: 70px; height: 70px; box-sizing: border-box; border: 2px solid #2F9461; border-left: none; background: #FFFFFF; display: grid; place-items: center; font-family: 'Kaiti SC','STKaiti','KaiTi','Noto Serif SC',serif; font-size: 54px; line-height: 1">虹</span></span>
        <span style="font-size: 21px; font-weight: 700">cǎi hóng</span>
      </button>

      <button type="button" aria-label="Hear 太阳" style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 22px 10px 16px; border-radius: 28px; border: 2px solid #FFFFFF; background: #FFE7D6; box-shadow: 0 4px 0 rgba(29,43,54,.08); font-family: inherit; color: inherit; cursor: pointer">
        <svg style="position: absolute; left: 12px; top: 10px" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#D9661A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="#F6C343"></circle><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"></path></svg>
        <span style="display: flex"><span class="tzg" style="width: 70px; height: 70px; box-sizing: border-box; border: 2px solid #2F9461; background: #FFFFFF; display: grid; place-items: center; font-family: 'Kaiti SC','STKaiti','KaiTi','Noto Serif SC',serif; font-size: 54px; line-height: 1">太</span><span class="tzg" style="width: 70px; height: 70px; box-sizing: border-box; border: 2px solid #2F9461; border-left: none; background: #FFFFFF; display: grid; place-items: center; font-family: 'Kaiti SC','STKaiti','KaiTi','Noto Serif SC',serif; font-size: 54px; line-height: 1">阳</span></span>
        <span style="font-size: 21px; font-weight: 700">tài yáng</span>
      </button>

      <button type="button" aria-label="Hear 下雨" style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 22px 10px 16px; border-radius: 28px; border: 2px solid #FFFFFF; background: #DDF3E6; box-shadow: 0 4px 0 rgba(29,43,54,.08); font-family: inherit; color: inherit; cursor: pointer">
        <svg style="position: absolute; left: 12px; top: 10px" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#2F6FB0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 14h10a3.6 3.6 0 0 0 .4-7.2A5 5 0 0 0 7.8 7.6 3.2 3.2 0 0 0 7 14z" fill="#FFFFFF"></path><path d="M8.5 17.5l-1 2.5M12.5 17.5l-1 2.5M16.5 17.5l-1 2.5"></path></svg>
        <span style="display: flex"><span class="tzg" style="width: 70px; height: 70px; box-sizing: border-box; border: 2px solid #2F9461; background: #FFFFFF; display: grid; place-items: center; font-family: 'Kaiti SC','STKaiti','KaiTi','Noto Serif SC',serif; font-size: 54px; line-height: 1">下</span><span class="tzg" style="width: 70px; height: 70px; box-sizing: border-box; border: 2px solid #2F9461; border-left: none; background: #FFFFFF; display: grid; place-items: center; font-family: 'Kaiti SC','STKaiti','KaiTi','Noto Serif SC',serif; font-size: 54px; line-height: 1">雨</span></span>
        <span style="font-size: 21px; font-weight: 700">xià yǔ</span>
      </button>

      <button type="button" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 180px; border-radius: 28px; border: none; background: #F6C343; box-shadow: 0 5px 0 #D9A51F; font-family: inherit; color: #1D2B36; cursor: pointer">
        <span style="width: 64px; height: 64px; border-radius: 50%; background: #FFFFFF; display: grid; place-items: center"><svg width="28" height="28" viewBox="0 0 24 24" fill="#1D2B36" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"></path></svg></span>
        <span style="font-size: 22px; font-weight: 800; line-height: 1.1">全部听</span>
        <span style="font-size: 15px; font-weight: 600">Play all</span>
      </button>
    </div>

    <div style="margin-top: 28px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 22px; font-size: 15px; font-weight: 600; color: #4F5F6B">
      <span style="display: flex; align-items: center; gap: 8px"><span style="min-width: 64px; height: 30px; box-sizing: border-box; padding: 0 10px; border: 2px solid #B9CCC1; border-bottom-width: 4px; border-radius: 8px; background: #FFFFFF; display: grid; place-items: center; font-size: 13px; font-weight: 800; color: #1D2B36">Space</span>Hear the word</span>
      <span style="display: flex; align-items: center; gap: 8px"><span style="min-width: 30px; height: 30px; box-sizing: border-box; border: 2px solid #B9CCC1; border-bottom-width: 4px; border-radius: 8px; background: #FFFFFF; display: grid; place-items: center; font-size: 14px; font-weight: 800; color: #1D2B36">←</span><span style="min-width: 30px; height: 30px; box-sizing: border-box; border: 2px solid #B9CCC1; border-bottom-width: 4px; border-radius: 8px; background: #FFFFFF; display: grid; place-items: center; font-size: 14px; font-weight: 800; color: #1D2B36">→</span>Move between words</span>
      <span style="display: flex; align-items: center; gap: 8px"><span style="min-width: 58px; height: 30px; box-sizing: border-box; padding: 0 10px; border: 2px solid #B9CCC1; border-bottom-width: 4px; border-radius: 8px; background: #FFFFFF; display: grid; place-items: center; font-size: 13px; font-weight: 800; color: #1D2B36">Enter</span>Next word in dictation</span>
    </div>
  </main>
</div>
</body>
</html>
