<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup: Parent corner (phone)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&amp;family=Noto+Serif+SC:wght@500&amp;display=swap">
<style>
body{margin:0}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #8E9A93; font-family: 'Baloo 2', system-ui, sans-serif; color: #1D2B36">

  <div aria-hidden="true" style="padding: 26px 20px; opacity: .55">
    <div style="font-family: 'Kaiti SC','STKaiti','KaiTi','Noto Serif SC',serif; font-size: 42px; color: #1D2B36">听写（十五）</div>
  </div>

  <section aria-label="Parent corner" style="position: absolute; left: 0; right: 0; top: 92px; bottom: 0; background: #FFFFFF; border-radius: 28px 28px 0 0; padding: 10px 20px 24px; display: flex; flex-direction: column; gap: 14px">
    <span aria-hidden="true" style="align-self: center; width: 44px; height: 5px; border-radius: 999px; background: #D0E2D7"></span>
    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="line-height: 1.15"><div style="font-size: 24px; font-weight: 800">Parent corner</div><div style="font-size: 14px; font-weight: 500; color: #4F5F6B">Lists, settings and tips</div></div>
      <button type="button" aria-label="Close parent corner" style="width: 44px; height: 44px; border-radius: 50%; border: none; background: #EEF6F1; display: grid; place-items: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1D2B36" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 14px; font-weight: 700; color: #4F5F6B">Choose a list by test date</div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <button type="button" style="display: flex; align-items: center; gap: 12px; height: 50px; padding: 0 14px; border-radius: 14px; border: 2px solid #E4EEE8; background: #F6FAF7; font-family: inherit; color: #4F5F6B; cursor: pointer">
          <span style="width: 76px; text-align: left; font-size: 15px; font-weight: 700">Tue 13 Oct</span><span style="flex: 1; text-align: left; font-family: 'Kaiti SC','STKaiti','KaiTi','Noto Serif SC',serif; font-size: 19px">听写（十四）</span><span style="width: 24px; height: 24px; border-radius: 50%; background: #F6C343; display: grid; place-items: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"></path></svg></span>
        </button>
        <button type="button" aria-pressed="true" style="display: flex; align-items: center; gap: 12px; height: 50px; padding: 0 14px; border-radius: 14px; border: 2px solid #2F9461; background: #DDF3E6; font-family: inherit; color: #1D2B36; cursor: pointer">
          <span style="width: 76px; text-align: left; font-size: 15px; font-weight: 800">Tue 20 Oct</span><span style="flex: 1; text-align: left; font-family: 'Kaiti SC','STKaiti','KaiTi','Noto Serif SC',serif; font-size: 19px">听写（十五）</span><span style="background: #F6C343; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 800">Next</span>
        </button>
        <button type="button" style="display: flex; align-items: center; gap: 12px; height: 50px; padding: 0 14px; border-radius: 14px; border: 2px solid #E4EEE8; background: #FFFFFF; font-family: inherit; color: #1D2B36; cursor: pointer">
          <span style="width: 76px; text-align: left; font-size: 15px; font-weight: 700">Tue 27 Oct</span><span style="flex: 1; text-align: left; font-family: 'Kaiti SC','STKaiti','KaiTi','Noto Serif SC',serif; font-size: 19px">听写（十六）</span>
        </button>
        <button type="button" style="display: flex; align-items: center; gap: 12px; height: 50px; padding: 0 14px; border-radius: 14px; border: 2px solid #E4EEE8; background: #FFFFFF; font-family: inherit; color: #1D2B36; cursor: pointer">
          <span style="width: 76px; text-align: left; font-size: 15px; font-weight: 700">Tue 3 Nov</span><span style="flex: 1; text-align: left; font-family: 'Kaiti SC','STKaiti','KaiTi','Noto Serif SC',serif; font-size: 19px">听写（十七）</span>
        </button>
        <button type="button" style="height: 36px; border: none; background: none; font-family: inherit; font-size: 14px; font-weight: 700; color: #1E6B45; cursor: pointer">Show 3 more lists</button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 14px; font-weight: 700; color: #4F5F6B">On the word cards</div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <button type="button" aria-pressed="true" style="display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 12px; border-radius: 14px; border: none; background: #EEF6F1; font-family: inherit; font-size: 15px; font-weight: 700; color: #1D2B36; cursor: pointer">Pinyin<span style="width: 40px; height: 24px; border-radius: 999px; background: #2F9461; position: relative"><span style="position: absolute; right: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: #FFFFFF"></span></span></button>
        <button type="button" aria-pressed="true" style="display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 12px; border-radius: 14px; border: none; background: #EEF6F1; font-family: inherit; font-size: 15px; font-weight: 700; color: #1D2B36; cursor: pointer">Pictures<span style="width: 40px; height: 24px; border-radius: 999px; background: #2F9461; position: relative"><span style="position: absolute; right: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: #FFFFFF"></span></span></button>
        <button type="button" aria-pressed="false" style="display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 12px; border-radius: 14px; border: none; background: #EEF6F1; font-family: inherit; font-size: 15px; font-weight: 700; color: #1D2B36; cursor: pointer">English<span style="width: 40px; height: 24px; border-radius: 999px; background: #B9CCC1; position: relative"><span style="position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: #FFFFFF"></span></span></button>
        <button type="button" aria-pressed="false" style="display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 12px; border-radius: 14px; border: none; background: #EEF6F1; font-family: inherit; font-size: 15px; font-weight: 700; color: #1D2B36; cursor: pointer">Slow voice<span style="width: 40px; height: 24px; border-radius: 999px; background: #B9CCC1; position: relative"><span style="position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: #FFFFFF"></span></span></button>
      </div>
    </div>

    <div style="background: #FFF7DB; border-radius: 16px; padding: 10px 14px; font-size: 14px; font-weight: 500; line-height: 1.45">
      <div style="font-weight: 800">How it works</div>
      <div>Learn: tap a word to hear it. Dictation: each word plays twice; she writes on paper, then checks with the faces. Missed words go to Tricky.</div>
    </div>

    <button type="button" style="margin-top: auto; height: 44px; border: none; background: none; font-family: inherit; font-size: 15px; font-weight: 700; color: #A8401A; cursor: pointer">Clear tricky words on this device</button>
  </section>
</div>
</body>
</html>
