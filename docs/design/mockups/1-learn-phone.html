<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup: Learn — kid view (phone)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&amp;family=Noto+Serif+SC:wght@500&amp;display=swap">
<style>
body{margin:0}
.tzg{position:relative}
.tzg::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:1.5px dashed rgba(47,148,97,.45)}
.tzg::after{content:"";position:absolute;top:50%;left:0;right:0;border-top:1.5px dashed rgba(47,148,97,.45)}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #EEF6F1; font-family: 'Baloo 2', system-ui, sans-serif; color: #1D2B36">

  <div style="padding: 22px 20px 0; display: flex; justify-content: space-between; align-items: flex-start">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="align-self: flex-start; background: #FFFFFF; color: #1E6B45; font-size: 13px; font-weight: 700; padding: 2px 12px; border-radius: 999px">本周 This week</span>
      <h1 style="margin: 4px 0 0; font-family: 'Kaiti SC','STKaiti','KaiTi','Noto Serif SC',serif; font-weight: 500; font-size: 42px; line-height: 1.1">听写（十五）</h1>
      <div style="display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600">Tue 20 Oct <span style="background: #F6C343; padding: 0 10px; border-radius: 999px; font-size: 13px; font-weight: 700">in 7 days</span></div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
      <button type="button" aria-label="Parent corner: press and hold" style="width: 48px; height: 48px; border-radius: 50%; border: none; background: #FFFFFF; display: grid; place-items: center; cursor: pointer">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4F5F6B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>
      </button>
      <span style="font-size: 11px; font-weight: 600; color: #4F5F6B">Parents: hold</span>
    </div>
  </div>

  <div style="margin: 14px 20px 0; background: #FFFFFF; border-radius: 18px; padding: 8px 14px; display: flex; align-items: center; justify-content: space-between">
    <span style="font-size: 14px; font-weight: 700">我的贴纸 <span style="font-weight: 500; color: #4F5F6B">My stickers</span></span>
    <div style="display: flex; gap: 6px">
      <span style="width: 26px; height: 26px; border-radius: 50%; background: #F6C343; display: grid; place-items: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"></path></svg></span>
      <span style="width: 26px; height: 26px; box-sizing: border-box; border-radius: 50%; border: 2px dashed #2F9461; background: #FFFFFF"></span>
      <span style="width: 26px; height: 26px; border-radius: 50%; background: #E1ECE5"></span>
      <span style="width: 26px; height: 26px; border-radius: 50%; background: #E1ECE5"></span>
      <span style="width: 26px; height: 26px; border-radius: 50%; background: #E1ECE5"></span>
      <span style="width: 26px; height: 26px; border-radius: 50%; background: #E1ECE5"></span>
      <span style="width: 26px; height: 26px; border-radius: 50%; background: #E1ECE5"></span>
    </div>
  </div>

  <div style="margin: 16px 20px 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">

    <button type="button" aria-label="Hear 星星" style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 16px 8px 12px; border-radius: 24px; border: 2px solid #FFFFFF; background: #FFF4C7; box-shadow: 0 3px 0 rgba(29,43,54,.08); font-family: inherit; color: inherit; cursor: pointer">
      <svg style="position: absolute; left: 12px; top: 10px" width="26" height="26" viewBox="0 0 24 24" fill="#F6C343" stroke="#B57F00" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"></path></svg>
      <span style="display: flex"><span class="tzg" style="width: 56px; height: 56px; box-sizing: border-box; border: 2px solid #2F9461; background: #FFFFFF; display: grid; place-items: center; font-family: 'Kaiti SC','STKaiti','KaiTi','Noto Serif SC',serif; font-size: 42px; line-height: 1">星</span><span class="tzg" style="width: 56px; height: 56px; box-sizing: border-box; border: 2px solid #2F9461; border-left: none; background: #FFFFFF; display: grid; place-items: center; font-family: 'Kaiti SC','STKaiti','KaiTi','Noto Serif SC',serif; font-size: 42px; line-height: 1">星</span></span>
      <span style="font-size: 18px; font-weight: 700">xīng xing</span>
    </button>

    <button type="button" aria-label="Hear 月亮 (playing)" style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 16px 8px 12px; border-radius: 24px; border: 3px solid #F6C343; background: #ECE6FF; box-shadow: 0 6px 0 rgba(246,195,67,.55); transform: scale(1.03); font-family: inherit; color: inherit; cursor: pointer">
      <svg style="position: absolute; left: 12px; top: 10px" width="26" height="26" viewBox="0 0 24 24" fill="#C9C2F5" stroke="#5B4FC4" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg>
      <span style="position: absolute; right: 12px; top: 14px; display: flex; align-items: flex-end; gap: 3px; height: 18px" aria-hidden="true"><span style="width: 4px; height: 8px; border-radius: 2px; background: #5B4FC4"></span><span style="width: 4px; height: 18px; border-radius: 2px; background: #5B4FC4"></span><span style="width: 4px; height: 12px; border-radius: 2px; background: #5B4FC4"></span></span>
      <span style="display: flex"><span class="tzg" style="width: 56px; height: 56px; box-sizing: border-box; border: 2px solid #2F9461; background: #FFFFFF; display: grid; place-items: center; font-family: 'Kaiti SC','STKaiti','KaiTi','Noto Serif SC',serif; font-size: 42px; line-height: 1">月</span><span class="tzg" style="width: 56px; height: 56px; box-sizing: border-box; border: 2px solid #2F9461; border-left: none; background: #FFFFFF; display: grid; place-items: center; font-family: 'Kaiti SC','STKaiti','KaiTi','Noto Serif SC',serif; font-size: 42px; line-height: 1">亮</span></span>
      <span style="font-size: 18px; font-weight: 700">yuè liàng</span>
    </button>

    <button type="button" aria-label="Hear 彩虹" style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 16px 8px 12px; border-radius: 24px; border: 2px solid #FFFFFF; background: #E2EFFF; box-shadow: 0 3px 0 rgba(29,43,54,.08); font-family: inherit; color: inherit; cursor: pointer">
      <svg style="position: absolute; left: 10px; top: 10px" width="30" height="26" viewBox="0 0 28 22" fill="none" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M3 19a11 11 0 0 1 22 0" stroke="#E5533D"></path><path d="M7 19a7 7 0 0 1 14 0" stroke="#F2A43A"></path><path d="M11 19a3 3 0 0 1 6 0" stroke="#2F7FC1"></path></svg>
      <span style="display: flex"><span class="tzg" style="width: 56px; height: 56px; box-sizing: border-box; border: 2px solid #2F9461; background: #FFFFFF; display: grid; place-items: center; font-family: 'Kaiti SC','STKaiti','KaiTi','Noto Serif SC',serif; font-size: 42px; line-height: 1">彩</span><span class="tzg" style="width: 56px; height: 56px; box-sizing: border-box; border: 2px solid #2F9461; border-left: none; background: #FFFFFF; display: grid; place-items: center; font-family: 'Kaiti SC','STKaiti','KaiTi','Noto Serif SC',serif; font-size: 42px; line-height: 1">虹</span></span>
      <span style="font-size: 18px; font-weight: 700">cǎi hóng</span>
    </button>

    <button type="button" aria-label="Hear 太阳" style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 16px 8px 12px; border-radius: 24px; border: 2px solid #FFFFFF; background: #FFE7D6; box-shadow: 0 3px 0 rgba(29,43,54,.08); font-family: inherit; color: inherit; cursor: pointer">
      <svg style="position: absolute; left: 10px; top: 8px" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#D9661A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="#F6C343"></circle><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"></path></svg>
      <span style="display: flex"><span class="tzg" style="width: 56px; height: 56px; box-sizing: border-box; border: 2px solid #2F9461; background: #FFFFFF; display: grid; place-items: center; font-family: 'Kaiti SC','STKaiti','KaiTi','Noto Serif SC',serif; font-size: 42px; line-height: 1">太</span><span class="tzg" style="width: 56px; height: 56px; box-sizing: border-box; border: 2px solid #2F9461; border-left: none; background: #FFFFFF; display: grid; place-items: center; font-family: 'Kaiti SC','STKaiti','KaiTi','Noto Serif SC',serif; font-size: 42px; line-height: 1">阳</span></span>
      <span style="font-size: 18px; font-weight: 700">tài yáng</span>
    </button>

    <button type="button" aria-label="Hear 下雨" style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 16px 8px 12px; border-radius: 24px; border: 2px solid #FFFFFF; background: #DDF3E6; box-shadow: 0 3px 0 rgba(29,43,54,.08); font-family: inherit; color: inherit; cursor: pointer">
      <svg style="position: absolute; left: 10px; top: 8px" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#2F6FB0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 14h10a3.6 3.6 0 0 0 .4-7.2A5 5 0 0 0 7.8 7.6 3.2 3.2 0 0 0 7 14z" fill="#FFFFFF"></path><path d="M8.5 17.5l-1 2.5M12.5 17.5l-1 2.5M16.5 17.5l-1 2.5"></path></svg>
      <span style="display: flex"><span class="tzg" style="width: 56px; height: 56px; box-sizing: border-box; border: 2px solid #2F9461; background: #FFFFFF; display: grid; place-items: center; font-family: 'Kaiti SC','STKaiti','KaiTi','Noto Serif SC',serif; font-size: 42px; line-height: 1">下</span><span class="tzg" style="width: 56px; height: 56px; box-sizing: border-box; border: 2px solid #2F9461; border-left: none; background: #FFFFFF; display: grid; place-items: center; font-family: 'Kaiti SC','STKaiti','KaiTi','Noto Serif SC',serif; font-size: 42px; line-height: 1">雨</span></span>
      <span style="font-size: 18px; font-weight: 700">xià yǔ</span>
    </button>

    <button type="button" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-radius: 24px; border: none; background: #F6C343; box-shadow: 0 4px 0 #D9A51F; font-family: inherit; color: #1D2B36; cursor: pointer">
      <span style="width: 58px; height: 58px; border-radius: 50%; background: #FFFFFF; display: grid; place-items: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="#1D2B36" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"></path></svg></span>
      <span style="font-size: 20px; font-weight: 800; line-height: 1.1">全部听</span>
      <span style="font-size: 14px; font-weight: 600">Play all</span>
    </button>
  </div>

  <nav aria-label="Sections" style="position: absolute; left: 0; right: 0; bottom: 0; height: 86px; box-sizing: border-box; padding: 8px 12px 18px; background: #FFFFFF; border-top: 1px solid #D5E6DC; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px">
    <button type="button" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 0; border: none; background: none; font-family: inherit; color: #1D2B36; cursor: pointer">
      <span style="width: 56px; height: 32px; border-radius: 999px; background: #CDEFD9; display: grid; place-items: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1E6B45" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"></path><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"></path></svg></span>
      <span style="font-size: 15px; font-weight: 800; line-height: 1.2">学习</span><span style="font-size: 11px; font-weight: 600; line-height: 1">Learn</span>
    </button>
    <button type="button" style="display: flex; flex-direction: column; align-items: center; gap: 0; border: none; background: none; font-family: inherit; color: #4F5F6B; cursor: pointer">
      <span style="width: 56px; height: 32px; display: grid; place-items: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4F5F6B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3l4 4L8 20H4v-4z"></path><path d="M14 6l4 4"></path></svg></span>
      <span style="font-size: 15px; font-weight: 700; line-height: 1.2">听写</span><span style="font-size: 11px; font-weight: 600; line-height: 1">Dictation</span>
    </button>
    <button type="button" style="display: flex; flex-direction: column; align-items: center; gap: 0; border: none; background: none; font-family: inherit; color: #4F5F6B; cursor: pointer">
      <span style="width: 56px; height: 32px; display: grid; place-items: center; position: relative"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4F5F6B" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"></path></svg><span style="position: absolute; right: 8px; top: 0; min-width: 18px; height: 18px; border-radius: 999px; background: #E07A1F; color: #FFFFFF; font-size: 11px; font-weight: 800; display: grid; place-items: center">2</span></span>
      <span style="font-size: 15px; font-weight: 700; line-height: 1.2">难词</span><span style="font-size: 11px; font-weight: 600; line-height: 1">Tricky</span>
    </button>
  </nav>
</div>
</body>
</html>
