<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup: Focus mode (iPad landscape)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&amp;family=Noto+Serif+SC:wght@500&amp;display=swap">
<style>
body{margin:0}
.tzg{position:relative}
.tzg::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:2px dashed rgba(47,148,97,.45)}
.tzg::after{content:"";position:absolute;top:50%;left:0;right:0;border-top:2px dashed rgba(47,148,97,.45)}
</style>
</head>
<body>
<div style="width: 1180px; height: 820px; box-sizing: border-box; position: relative; overflow: hidden; background: #EEF6F1; font-family: 'Baloo 2', system-ui, sans-serif; color: #1D2B36; display: flex; flex-direction: column; padding: 24px 32px 28px">

  <div style="display: flex; align-items: center; justify-content: space-between">
    <button type="button" style="height: 52px; padding: 0 20px 0 14px; border-radius: 999px; border: none; background: #FFFFFF; display: flex; align-items: center; gap: 10px; font-family: inherit; color: #1D2B36; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1D2B36" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="2"></rect><rect x="13.5" y="3.5" width="7" height="7" rx="2"></rect><rect x="3.5" y="13.5" width="7" height="7" rx="2"></rect><rect x="13.5" y="13.5" width="7" height="7" rx="2"></rect></svg>
      <span style="font-size: 18px; font-weight: 800">全部</span><span style="font-size: 15px; font-weight: 600; color: #4F5F6B">All words</span>
    </button>
    <div style="text-align: center; line-height: 1.1">
      <div style="font-family: 'Kaiti SC','STKaiti','KaiTi','Noto Serif SC',serif; font-size: 34px">听写（十五）</div>
      <div style="font-size: 15px; font-weight: 600; color: #4F5F6B">Tue 20 Oct, in 7 days</div>
    </div>
    <button type="button" aria-label="Parent corner: press and hold" style="height: 52px; padding: 0 16px; border-radius: 999px; border: none; background: #FFFFFF; display: flex; align-items: center; gap: 8px; font-family: inherit; color: #4F5F6B; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4F5F6B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"></path></svg>
      <span style="font-size: 14px; font-weight: 700">Parents: hold</span>
    </button>
  </div>

  <div style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 40px">
    <button type="button" aria-label="Previous word" style="width: 84px; height: 84px; border-radius: 50%; border: none; background: #FFFFFF; box-shadow: 0 4px 0 rgba(29,43,54,.08); display: grid; place-items: center; cursor: pointer"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#1D2B36" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>

    <div style="width: 640px; box-sizing: border-box; background: #E2EFFF; border: 3px solid #FFFFFF; border-radius: 40px; box-shadow: 0 8px 0 rgba(29,43,54,.07); padding: 30px 30px 34px; display: flex; flex-direction: column; align-items: center; gap: 14px">
      <svg width="96" height="76" viewBox="0 0 28 22" fill="none" stroke-width="2.4" stroke-linecap="round" role="img" aria-label="Rainbow"><path d="M3 19a11 11 0 0 1 22 0" stroke="#E5533D"></path><path d="M7 19a7 7 0 0 1 14 0" stroke="#F2A43A"></path><path d="M11 19a3 3 0 0 1 6 0" stroke="#2F7FC1"></path></svg>
      <div style="display: flex">
        <span class="tzg" style="width: 200px; height: 200px; box-sizing: border-box; border: 3px solid #2F9461; background: #FFFFFF; display: grid; place-items: center; font-family: 'Kaiti SC','STKaiti','KaiTi','Noto Serif SC',serif; font-size: 156px; line-height: 1">彩</span>
        <span class="tzg" style="width: 200px; height: 200px; box-sizing: border-box; border: 3px solid #2F9461; border-left: none; background: #FFFFFF; display: grid; place-items: center; font-family: 'Kaiti SC','STKaiti','KaiTi','Noto Serif SC',serif; font-size: 156px; line-height: 1">虹</span>
      </div>
      <div style="font-size: 40px; font-weight: 800; line-height: 1.1">cǎi hóng</div>
      <button type="button" style="margin-top: 4px; height: 70px; padding: 0 34px 0 14px; border-radius: 999px; border: none; background: #F6C343; box-shadow: 0 5px 0 #D9A51F; display: flex; align-items: center; gap: 14px; font-family: inherit; color: #1D2B36; cursor: pointer">
        <span style="width: 50px; height: 50px; border-radius: 50%; background: #FFFFFF; display: grid; place-items: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1D2B36" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="#1D2B36"></path><path d="M15.5 9a4.2 4.2 0 0 1 0 6"></path><path d="M18 6.5a8 8 0 0 1 0 11"></path></svg></span>
        <span style="font-size: 24px; font-weight: 800">听一听</span><span style="font-size: 17px; font-weight: 600">Listen</span>
      </button>
    </div>

    <button type="button" aria-label="Next word" style="width: 84px; height: 84px; border-radius: 50%; border: none; background: #1D2B36; display: grid; place-items: center; cursor: pointer"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#F6C343" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between">
    <span style="width: 220px; font-size: 15px; font-weight: 600; color: #4F5F6B">Swipe or use the arrows</span>
    <div style="display: flex; align-items: center; gap: 10px" aria-label="Word 3 of 5">
      <span style="width: 14px; height: 14px; border-radius: 50%; background: #B9CCC1"></span>
      <span style="width: 14px; height: 14px; border-radius: 50%; background: #B9CCC1"></span>
      <span style="width: 40px; height: 14px; border-radius: 999px; background: #2F9461"></span>
      <span style="width: 14px; height: 14px; border-radius: 50%; background: #B9CCC1"></span>
      <span style="width: 14px; height: 14px; border-radius: 50%; background: #B9CCC1"></span>
    </div>
    <button type="button" style="width: 220px; height: 56px; border-radius: 999px; border: 2px solid #1D2B36; background: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: inherit; color: #1D2B36; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1D2B36" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3l4 4L8 20H4v-4z"></path></svg>
      <span style="font-size: 18px; font-weight: 800">开始听写</span><span style="font-size: 14px; font-weight: 600">Dictation</span>
    </button>
  </div>
</div>
</body>
</html>
